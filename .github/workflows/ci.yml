name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned by major rather than taken from the runner image, so the build does
  # not drift as that image's default clang moves. The Bazel cache key names
  # the compiler's full version rather than this one: the autodetected
  # toolchain is not an input to any action, so a point release within the
  # major has to invalidate the cached objects explicitly.
  LLVM_MAJOR: "21"

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  buildifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check Bazel files
        run: |
          curl -sSfL -o buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.2.1/buildifier-linux-amd64
          chmod +x buildifier
          ./buildifier -mode=check -lint=warn -r .

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check C++ formatting
        run: |
          pip install clang-format==19.1.7
          git ls-files -z '*.cc' '*.h' | xargs -0 -r clang-format --dry-run --Werror
      - name: Check Python formatting and lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check third_party/icu/dat_to_c.py scripts/check-version.py scripts/validate-schemas.py"
      - name: Check Python formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check third_party/icu/dat_to_c.py scripts/check-version.py scripts/validate-schemas.py"

  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate protocol schemas and examples
        run: |
          pip install 'jsonschema>=4.23,<5'
          python3 scripts/validate-schemas.py

  # The binary and the tests are built in two jobs that share one Bazel disk
  # cache. GoogleSQL, ICU and protobuf are ~95% of the compile and are pinned
  # by MODULE.bazel.lock, so the cache key covers only the inputs that decide
  # how those are built. A commit touching just frontend/ or docs recompiles
  # its own handful of objects and reuses everything else.
  #
  # Splitting also bounds the damage when a runner is lost mid-build: `build`
  # has already saved the cache by the time `test` starts, so a failed `test`
  # rerun starts warm instead of repeating the whole compile.
  #
  # Both jobs compile at three quarters of the runner's cores rather than all
  # of them, to keep concurrent clang processes from reaching the runner's
  # memory limit. --local_ram_resources is not the lever it looks like: local
  # actions carry a fixed default memory estimate, so on a 16 GB runner the
  # job count binds long before it does. Giving up a quarter of the
  # parallelism is what actually lowers the peak, and the timeouts below are
  # raised from 180 to absorb the slower cold build that costs.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          df -h /
      # A few GoogleSQL translation units are very large: the 36 objects in
      # resolved_ast average 2.3 MB, and clang's peak RSS on those under -O2 is
      # what puts a 16 GB runner within reach of its limit. Swap absorbs the
      # spike a concurrency limit cannot, since one compile -- or the final
      # link of an 86 MB binary -- can be the single action that overruns.
      # /mnt is the runner's large temp disk, away from the Bazel cache on /.
      - name: Add swap
        run: |
          free -h
          sudo fallocate -l 8G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          free -h
      - uses: actions/checkout@v7
      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_MAJOR"
      # Computed once here and published as a job output, so `test` restores
      # exactly this key and the two cannot drift apart. Everything named here
      # decides how the pinned dependencies compile; nothing under frontend/ is
      # named, which is what keeps the key stable across ordinary commits.
      #
      # The compiler is named by its full version rather than by LLVM_MAJOR,
      # because the autodetected toolchain reaches actions by path only: a
      # point release within the major would otherwise leave objects built by
      # the previous compiler in the cache and reuse them.
      - name: Compute the Bazel cache key
        id: cache-key
        env:
          INPUTS_HASH: >-
            ${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc',
            '.bazelversion', 'GOOGLESQL_COMMIT', 'patches/**',
            'third_party/**') }}
        run: |
          cc_id="$("clang-$LLVM_MAJOR" --version | head -n 1 | sha256sum)"
          printf 'key=bazel-disk-%s-llvm%s-%s-%s\n' \
            "${{ runner.os }}" "$LLVM_MAJOR" "${cc_id:0:16}" "$INPUTS_HASH" \
            >> "$GITHUB_OUTPUT"
      # Restore and save. A hit skips the save, so the cache for a given key is
      # written once and then only read.
      - name: Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.cache-key.outputs.key }}
      - name: Build the frontend binary
        run: |
          pip install 'jsonschema>=4.23,<5'
          bazel --version
          "clang-$LLVM_MAJOR" --version
          bazel build -c opt \
            '--jobs=HOST_CPUS*.75' \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repo_env=CC="/usr/bin/clang-$LLVM_MAJOR" \
            --repo_env=CXX="/usr/bin/clang++-$LLVM_MAJOR" \
            //frontend:googlesql-frontend
          python3 scripts/check-version.py \
            --binary bazel-bin/frontend/googlesql-frontend
          python3 scripts/validate-schemas.py \
            --binary bazel-bin/frontend/googlesql-frontend
          df -h /

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          df -h /
      # A few GoogleSQL translation units are very large: the 36 objects in
      # resolved_ast average 2.3 MB, and clang's peak RSS on those under -O2 is
      # what puts a 16 GB runner within reach of its limit. Swap absorbs the
      # spike a concurrency limit cannot, since one compile -- or the final
      # link of an 86 MB binary -- can be the single action that overruns.
      # /mnt is the runner's large temp disk, away from the Bazel cache on /.
      - name: Add swap
        run: |
          free -h
          sudo fallocate -l 8G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          free -h
      - uses: actions/checkout@v7
      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_MAJOR"
      # `test` keeps its own entry, seeded from `build`'s. Testing //... builds
      # the cc_library targets in a second, position-independent variant that
      # building the binary alone never produces, so a large part of the graph
      # compiles under action keys `build` cannot have written: measured, 2129
      # of 5039 actions hit `build`'s cache and 1499 still ran, 71 minutes of
      # them. Restoring read-only would repeat that every run, because nothing
      # would ever persist the variant. Saving under a key of its own makes the
      # second run onwards a replay; restore-keys is what seeds the first.
      - name: Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: ${{ needs.build.outputs.cache-key }}-test
          restore-keys: ${{ needs.build.outputs.cache-key }}
      - name: Run the tests
        run: |
          bazel --version
          "clang-$LLVM_MAJOR" --version
          bazel test -c opt \
            '--jobs=HOST_CPUS*.75' \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repo_env=CC="/usr/bin/clang-$LLVM_MAJOR" \
            --repo_env=CXX="/usr/bin/clang++-$LLVM_MAJOR" \
            --test_output=errors \
            //...
          df -h /
